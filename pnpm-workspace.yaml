allowBuilds:
  esbuild: true
  workerd: true

# miniflare fija undici@7.28.0 de forma exacta y esa version arrastra 5 avisos
# de dependabot. Se puede quitar cuando miniflare suba a 7.29.0 o superior.
#
# js-yaml/svgo van pinneados por astro@7.3.2 (@astrojs/markdown-remark), fast-uri
# por @astrojs/check -> @astrojs/language-server -> yaml-language-server -> ajv,
# y nanoid por postcss (via sanitize-html/vite). Miniflare (via wrangler) fija su
# propio sharp@0.35.2 exacto igual que hacia con undici. Se pueden quitar cuando
# esos paquetes suban su rango internamente.
overrides:
  undici@>=7.0.0 <7.29.0: ^7.29.0
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  svgo@>=4.0.0 <4.1.0: ^4.1.0
  fast-uri@>=3.0.0 <3.1.6: ^4.0.0
  nanoid@>=3.0.0 <3.3.18: ^3.3.19
  sharp@>=0.35.0 <0.35.4: ^0.35.4
